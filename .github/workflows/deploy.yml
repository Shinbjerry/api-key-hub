# 部署Vite项目到Github Pages
name: Build & Deploy Pages

# 触发规则：main分支推送自动部署 + Actions页面可手动Run workflow
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 权限配置（必须，否则无法发布pages）
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制，避免多次打包冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1.拉取项目源码
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2.配置Node20，npm缓存加速安装
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3.npm安装依赖（彻底移除pnpm，解决之前打包报错）
      - name: Install dependencies
        run: npm install

      # 4.Vite打包生成dist，新增.nojekyll防止静态资源丢失
      - name: Build dist files
        run: |
          npm run build
          touch dist/.nojekyll

      # 5.上传dist产物作为部署资源
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 部署任务
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Github Pages
        id: deployment
        uses: actions/deploy-pages@v4
